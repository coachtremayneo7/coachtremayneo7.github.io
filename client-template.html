<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- ══════════════════════════════════════════════════════════════
     👇  EDIT ONLY WHAT'S BETWEEN THE LINES BELOW  👇
     Change the name, the greeting, and the questions.
     Then hit Commit. That's it. Everything else runs itself.
     ══════════════════════════════════════════════════════════════ -->
<script>
const BUSINESS = {
  name:     "Dirty Dawgz Grooming",              // the shop's name
  emoji:    "🐾",                                 // a fitting emoji
  greeting: "Hey! Thanks for messaging Dirty Dawgz 🐾 How can I help you today?",
  bookText: "📅 Book an appointment",             // the button label
  bookLink: "https://calendly.com/coachtremayne"  // where the button sends them
};

// The questions a real customer would ask — with the answer the AI gives.
// Add or remove as many as you want. Keep answers short and friendly.
const QUESTIONS = [
  {
    q: "Do you have anything open this weekend?",
    a: "Yes! Saturday has 10:00 AM and 1:30 PM open, and Sunday has a 12:15 PM. Want me to grab one for your pup?"
  },
  {
    q: "How much is a full groom for a medium dog?",
    a: "A full groom for a medium dog runs $65 — that's bath, haircut, nails, ears, and a bandana to finish. 🐾"
  },
  {
    q: "Do you do nail trims only?",
    a: "We do! A nail trim on its own is $15 and takes about 10 minutes — no appointment needed most days."
  },
  {
    q: "Where are you located?",
    a: "We're right here in Bowling Green, KY. Want me to text you the address and parking info?"
  }
];
</script>
<!-- ══════════════════════════════════════════════════════════════
     ✋  STOP — DON'T EDIT ANYTHING BELOW THIS LINE
     ══════════════════════════════════════════════════════════════ -->

<title>AI Front Desk Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --ink:#0A0C12; --ink-2:#10141C; --ink-3:#161B25; --line:#232B3A;
    --amber:#FFB020; --cream:#F3EEE4; --muted:#9AA1AE; --slate:#242C3A;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--cream);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 0,rgba(255,176,32,.10),transparent 60%);pointer-events:none}

  .brandbar{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:18px;display:flex;align-items:center;gap:8px;z-index:1}
  .brandbar .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 2px rgba(255,176,32,.7);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .phone{width:380px;max-width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:30px;padding:14px;box-shadow:0 40px 90px -30px rgba(0,0,0,.85);z-index:1;display:flex;flex-direction:column;height:min(78vh,680px)}
  .p-head{display:flex;align-items:center;gap:11px;padding:6px 6px 14px;border-bottom:1px solid var(--line)}
  .p-ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2b3242,#171c26);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
  .p-name{font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.1}
  .p-status{font-family:var(--mono);font-size:.62rem;color:#7CE0A0;display:flex;align-items:center;gap:5px;margin-top:2px}
  .p-status .d{width:6px;height:6px;border-radius:50%;background:#7CE0A0;box-shadow:0 0 8px #7CE0A0}

  .thread{flex:1;overflow-y:auto;padding:16px 4px;display:flex;flex-direction:column;gap:10px}
  .thread::-webkit-scrollbar{width:0}
  .msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:.9rem;line-height:1.45;animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .them{align-self:flex-start;background:var(--slate);border-bottom-left-radius:5px}
  .ai{align-self:flex-end;background:linear-gradient(180deg,#FFC24D,var(--amber));color:#150E02;border-bottom-right-radius:5px}
  .typing{align-self:flex-end;background:var(--amber);border-radius:16px;border-bottom-right-radius:5px;padding:13px 15px;display:inline-flex;gap:4px}
  .typing span{width:6px;height:6px;border-radius:50%;background:#150E02;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .chips{padding:10px 4px 4px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line)}
  .chip{font-family:var(--body);font-size:.8rem;color:var(--cream);background:var(--ink-3);border:1px solid var(--line);padding:9px 13px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip:hover,.chip:active{border-color:var(--amber);color:var(--amber)}
  .book{margin-top:10px;text-align:center;font-family:var(--body);font-weight:600;font-size:.95rem;background:linear-gradient(180deg,#FFC24D,var(--amber));color:#0A0C12;text-decoration:none;padding:13px;border-radius:12px;display:block}

  .foot{font-family:var(--mono);font-size:.64rem;color:var(--muted);margin-top:16px;z-index:1;letter-spacing:.04em}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="brandbar"><span class="dot"></span>AI Front Desk · powered by AfterHours</div>

  <div class="phone">
    <div class="p-head">
      <div class="p-ava" id="ava">💬</div>
      <div>
        <div class="p-name" id="bizname">Business</div>
        <div class="p-status"><span class="d"></span> Answering now</div>
      </div>
    </div>
    <div class="thread" id="thread"></div>
    <div class="chips" id="chips"></div>
    <a class="book" id="book" href="#">Book</a>
  </div>

  <div class="foot">This is a live demo. Tap a question to see it answer.</div>

<script>
  // Wire the editable config into the page
  document.getElementById('bizname').textContent = BUSINESS.name;
  document.getElementById('ava').textContent = BUSINESS.emoji;
  document.title = BUSINESS.name + " — AI Front Desk";
  var book = document.getElementById('book');
  book.textContent = BUSINESS.bookText;
  book.href = BUSINESS.bookLink;

  var thread = document.getElementById('thread');
  var chips  = document.getElementById('chips');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function bubble(cls, text){
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    thread.appendChild(d);
    thread.scrollTop = thread.scrollHeight;
    return d;
  }

  function ask(item, chipEl){
    chipEl.style.display = 'none';               // used-up question disappears
    bubble('them', item.q);                       // customer message
    if(reduce){ bubble('ai', item.a); return; }
    var t = document.createElement('div');        // typing indicator
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    thread.appendChild(t);
    thread.scrollTop = thread.scrollHeight;
    setTimeout(function(){ t.remove(); bubble('ai', item.a); }, 1100);
  }

  // Greeting on load
  setTimeout(function(){ bubble('ai', BUSINESS.greeting); }, 300);

  // Build the tappable question chips
  QUESTIONS.forEach(function(item){
    var c = document.createElement('button');
    c.className = 'chip';
    c.textContent = item.q;
    c.onclick = function(){ ask(item, c); };
    chips.appendChild(c);
  });
</script>
</body>
</html>
