<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Check-in</title>
<style>
  :root { --ink:#14181f; --muted:#667085; --line:#e2e6ea; --bg:#f4f6f8; --accent:#1f6feb; --ok:#37c46b; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); margin:0; padding:24px; }
  .card { max-width:520px; margin:24px auto; background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
  label { display:block; font-size:13px; font-weight:600; margin:16px 0 6px; }
  label:first-of-type { margin-top:0; }
  .req { color:var(--muted); font-weight:400; }
  input, textarea { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; }
  textarea { resize:vertical; min-height:120px; }
  .row { display:flex; gap:12px; } .row>div{flex:1;}
  button { width:100%; margin-top:22px; background:var(--ink); color:#fff; border:0; border-radius:12px; padding:15px; font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  .ok { text-align:center; padding:20px 0; }
  .ok .check { width:56px; height:56px; border-radius:50%; background:var(--ok); color:#fff; font-size:30px; line-height:56px; margin:0 auto 14px; }
  .ok h2 { margin:0 0 6px; font-size:20px; }
  .ok p { color:var(--muted); margin:0; }
  .err { background:#fdecec; border:1px solid #f5c2c2; color:#a12; border-radius:10px; padding:12px; font-size:14px; margin-top:14px; }
  .note { background:#fff8ec; border:1px solid #ffe6b8; border-radius:10px; padding:12px; font-size:14px; color:#7a5a10; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Weekly Check-in</h1>
  <p class="sub">Tell your coach how the week went. A couple of sentences is plenty.</p>

  <div id="form">
    <label>How did this week go? <span class="req">(required)</span></label>
    <textarea id="msg" placeholder="Workouts, energy, food, sleep, wins, struggles — whatever stood out."></textarea>

    <div class="row">
      <div>
        <label>Weight <span class="req">(optional)</span></label>
        <input id="weight" inputmode="decimal" placeholder="lb">
      </div>
      <div>
        <label>Workouts done <span class="req">(optional)</span></label>
        <input id="workouts" inputmode="numeric" placeholder="#">
      </div>
    </div>

    <button id="send">Send my check-in</button>
    <div id="err"></div>
  </div>
</div>

<script>
  // === CONFIG ===
  // Point this at your Worker. Each client gets a personal link with ?c=THEIR_ID
  //   e.g.  https://yoursite/client-checkin.html?c=reset_sarah
  const WORKER_URL = "https://checkin-api.quantumflexpt.workers.dev";

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const clientId = (params.get("c") || params.get("client") || "").trim();

  if (!clientId) {
    $("form").innerHTML = '<div class="note">This check-in link is missing your personal ID. Please use the exact link your coach sent you (it ends with <b>?c=your-id</b>).</div>';
  }

  $("send") && $("send").addEventListener("click", async () => {
    $("err").innerHTML = "";
    const message = $("msg").value.trim();
    if (!message) { $("err").innerHTML = '<div class="err">Please write a quick note about your week.</div>'; return; }
    const btn = $("send"); btn.disabled = true; btn.textContent = "Sending…";

    const metrics = {
      weight_lb: $("weight").value ? Number($("weight").value) : null,
      workouts_done: $("workouts").value ? Number($("workouts").value) : null,
    };

    try {
      const res = await fetch(WORKER_URL.replace(/\/+$/,"") + "/intake", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ client_id: clientId, message, metrics }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Something went wrong.");
      $("card").innerHTML = '<div class="ok"><div class="check">&#10003;</div><h2>Check-in sent!</h2><p>' + (data.message || "Your coach will follow up soon.") + '</p></div>';
    } catch (e) {
      btn.disabled = false; btn.textContent = "Send my check-in";
      $("err").innerHTML = '<div class="err">Couldn\'t send: ' + String(e.message || e) + '. Please try again.</div>';
    }
  });
</script>
</body>
</html>
