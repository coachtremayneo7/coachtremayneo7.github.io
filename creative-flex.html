<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creative Flex Media — AI Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
--ink:#0F1115; --panel:#171A21; --panel-2:#1E222B; --line:#2A2F3A;
--gold:#E8B04B; --gold-soft:#F5C878; --live:#4ADE80;
--text:#E8E6E1; --muted:#8A8F98; --user:#2A2F3A; --bot:#20252F;
--display:'Space Grotesk',system-ui,sans-serif;
--body:'Inter',system-ui,sans-serif;
--mono:'Space Mono','SFMono-Regular',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);
background:radial-gradient(120% 80% at 50% -10%, rgba(232,176,75,0.10), transparent 60%),var(--ink);
color:var(--text);display:flex;justify-content:center;padding:20px 14px 40px;-webkit-font-smoothing:antialiased;}
.app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
.bar{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;overflow:hidden;}
.bar::before{content:"";position:absolute;top:-40px;right:-30px;width:160px;height:160px;
background:radial-gradient(circle, rgba(232,176,75,0.28), transparent 70%);filter:blur(6px);pointer-events:none;}
.brand{display:flex;align-items:center;gap:9px;position:relative}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--live);
box-shadow:0 0 0 0 rgba(74,222,128,0.6);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,0.55)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.brand h1{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.2px;}
.brand h1 span{color:var(--gold)}
.status-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px;position:relative;}
.clock{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;color:var(--gold-soft)}
.clock small{display:block;font-family:var(--body);font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:500;margin-top:6px;text-transform:uppercase}
.status-pill{text-align:right;font-size:11px;line-height:1.5;}
.status-pill .closed{color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.status-pill .answering{color:var(--live);font-weight:600}
.chat-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;}
.biz-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;}
.biz-avatar{width:34px;height:34px;border-radius:10px;flex:0 0 auto;
background:linear-gradient(145deg,var(--gold),#a9741f);display:flex;align-items:center;justify-content:center;
font-family:var(--display);font-weight:700;color:#1a1205;font-size:15px;}
.biz-head .name{font-family:var(--display);font-weight:600;font-size:14.5px}
.biz-head .type{font-size:11px;color:var(--muted);margin-top:1px}
.transcript{padding:16px;display:flex;flex-direction:column;gap:11px;height:360px;overflow-y:auto;scroll-behavior:smooth;}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.user{background:var(--user);border-bottom-right-radius:5px;align-self:flex-end}
.msg.bot .who{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:4px;display:block}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:var(--bot);border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:5px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.3s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none;border-top:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
font-family:var(--body);font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
.chip:hover{color:var(--text);border-color:var(--gold);}
.composer{display:flex;gap:8px;padding:12px 14px 14px}
.composer input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;color:var(--text);
font-family:var(--body);font-size:14px;padding:12px 14px;outline:none;}
.composer input:focus{border-color:var(--gold)}
.composer input::placeholder{color:#5c626d}
.send{background:linear-gradient(180deg,var(--gold),#cf9836);color:#1a1205;border:none;border-radius:12px;padding:0 16px;
font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer;transition:.15s;}
.send:hover{filter:brightness(1.06)}
.send:disabled{opacity:.5;cursor:not-allowed}
.foot{text-align:center;font-size:10.5px;color:#5c626d;letter-spacing:.3px;padding:0 8px}
</style>
</head>
<body>
<div class="app">
<div class="bar">
<div class="brand">
<span class="dot"></span>
<h1>After<span>Hours</span> · AI Front Desk</h1>
</div>
<div class="status-row">
<div class="clock"><span id="clock">--:--</span><small>Local time</small></div>
<div class="status-pill">
<div class="closed" id="bizStatus">AFTER HOURS</div>
<div class="answering">● Front desk answering</div>
</div>
</div>
</div>
<div class="chat-card">
<div class="biz-head">
<div class="biz-avatar" id="avatar">C</div>
<div>
<div class="name" id="bizName">—</div>
<div class="type" id="bizType">—</div>
</div>
</div>
<div class="transcript" id="transcript"></div>
<div class="chips" id="chips"></div>
<div class="composer">
<input id="input" type="text" placeholder="Ask like a client would…" autocomplete="off" />
<button class="send" id="send">Send</button>
</div>
</div>
<div class="foot">Answers your DMs 24/7 · even after hours</div>
</div>

<script>
/* ============================================================
CREATIVE FLEX MEDIA — real client config
============================================================ */
const BUSINESS = {
name: "Creative Flex Media",
type: "Photography · Bowling Green, KY",
services: "Portrait photography in Bowling Green, KY. Specialties: family portraits, graduation and senior portraits, couples, and creative shoots. Boudoir sessions also available. " +
"PACKAGES: Silver $150 (15-20 minute session, 4 edited photos, one location). " +
"Gold $250 (30-45 minute session, 10 edited photos, one location). " +
"Platinum $400 (one hour session, 20 edited photos, up to two locations). " +
"All packages include an online gallery and retouching. " +
"ADD-ONS: additional edits $10 each, gallery release $100, print release $100. Prints available on site. Additional time available on request. " +
"Booking inquiries can also go to creativeflexbooking@gmail.com.",
hours: "By appointment only — sessions are scheduled through the booking link",
persona: "warm, fun, outgoing, creative, and a little funny — like a photographer who makes people feel comfortable on a shoot. Never stiff or corporate. " +
"IMPORTANT — how to handle any booking inquiry: LEAN INTO what the client is asking about. Do not deflect or steer them toward other services. " +
"Instead, get curious and ask 1-2 quick discovery questions to move it forward, such as: do they have a location in mind, a desired date or time, a deadline they are working toward, and roughly how many people are involved. " +
"Then point them to the booking link to submit their inquiry. " +
"If it is something outside the usual specialties (like a sports team), still engage warmly and ask those same discovery questions — never lead with what you do not do. Treat every inquiry as a real opportunity worth exploring",
booking_link: "unscriptedphotographers.com"
};
const QUESTIONS = [
"How much for a photoshoot?",
"Do you do graduation photos?",
"Are you available next weekend?",
"How many edited photos do I get?"
];

/* ---- Worker (leave as-is) ---- */
const WORKER_URL = "https://frontdesk-api.quantumflexpt.workers.dev/frontdesk";
const API_SECRET = "";

/* ============================================================
Engine — no need to edit below
============================================================ */
const el = id => document.getElementById(id);
let busy = false;

function tick(){
const now = new Date();
let h = now.getHours(), m = now.getMinutes();
const ampm = h >= 12 ? "PM" : "AM";
const h12 = ((h + 11) % 12) + 1;
el("clock").textContent = `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
el("bizStatus").textContent = (h < 9 || h >= 18) ? "AFTER HOURS" : "COVERED ALL DAY";
}
setInterval(tick, 1000); tick();

function addMsg(role, text){
const d = document.createElement("div");
d.className = "msg " + (role === "user" ? "user" : "bot");
if(role === "bot"){
const who = document.createElement("span");
who.className = "who"; who.textContent = BUSINESS.name;
d.appendChild(who);
d.appendChild(document.createTextNode(text));
} else { d.textContent = text; }
const t = el("transcript"); t.appendChild(d); t.scrollTop = t.scrollHeight;
}
function showTyping(){
const d = document.createElement("div");
d.className = "typing"; d.id = "typing";
d.innerHTML = "<span></span><span></span><span></span>";
const t = el("transcript"); t.appendChild(d); t.scrollTop = t.scrollHeight;
}
function hideTyping(){ const t = el("typing"); if(t) t.remove(); }

function buildChips(){
const wrap = el("chips"); wrap.innerHTML = "";
QUESTIONS.forEach(q => {
const c = document.createElement("button");
c.className = "chip"; c.textContent = q;
c.onclick = () => { if(!busy){ el("input").value = q; sendMessage(); } };
wrap.appendChild(c);
});
}

function sendMessage(){
const input = el("input");
const text = input.value.trim();
if(!text || busy) return;
input.value = "";
addMsg("user", text);
busy = true; el("send").disabled = true;
showTyping();
askFrontDesk(text)
.then(reply => { hideTyping(); addMsg("bot", reply); })
.catch(err => { hideTyping(); addMsg("bot", "Give me one sec and try that again."); console.error(err); })
.finally(() => { busy = false; el("send").disabled = false; input.focus(); });
}

async function askFrontDesk(message){
const headers = { "Content-Type":"application/json" };
if(API_SECRET) headers["X-Api-Secret"] = API_SECRET;
const res = await fetch(WORKER_URL, {
method:"POST", headers,
body: JSON.stringify({
message,
biz_name: BUSINESS.name,
services: BUSINESS.services,
hours: BUSINESS.hours,
persona: BUSINESS.persona,
booking_link: BUSINESS.booking_link
})
});
if(!res.ok) throw new Error("Worker HTTP " + res.status);
const data = await res.json();
const reply = (data.reply || "").trim();
if(!reply) throw new Error("Empty reply");
return reply;
}

/* boot */
el("avatar").textContent = "C";
el("bizName").textContent = BUSINESS.name;
el("bizType").textContent = BUSINESS.type;
addMsg("bot", `Hey! Thanks for reaching out to ${BUSINESS.name} 📸 We're not in the studio right now, but I can still help. What are you looking to shoot?`);
buildChips();
el("send").onclick = sendMessage;
el("input").addEventListener("keydown", e => { if(e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
