<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="api-base" content="https://checkin-api.quantumflexpt.workers.dev">
<title>Book training</title>
<style>
  :root { --bg:#0d0f12; --card:#161a20; --line:#2a313b; --text:#eef1f5; --muted:#9aa4b2; --brand:#f5a524; --ok:#34c77b; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.5rem; margin:8px 0 4px; }
  h2 { font-size:1.05rem; margin:22px 0 8px; color:var(--brand); }
  .lede { color:var(--muted); margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:8px 0; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .meta { color:var(--muted); font-size:.92rem; }
  .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:.85rem; color:var(--muted); }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.bad { color:var(--bad); border-color:var(--bad); }
  button { min-height:44px; min-width:44px; padding:10px 16px; border-radius:10px; border:0; background:var(--brand); color:#111; font-weight:700; font-size:1rem; cursor:pointer; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #msg { min-height:1.4em; margin:12px 0; font-weight:600; }
  #msg[data-state="bad"] { color:var(--bad); }
  #msg[data-state="ok"] { color:var(--ok); }
  .notice { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .hidden { display:none !important; }
  @media (max-width:380px) { main { padding:12px; } .card { padding:12px; } }
</style>
</head>
<body>
<main>
  <h1>Book training</h1>
  <p class="lede">Sessions are 45 minutes. Times are Central Time. You can book up to 3 sessions per week (Monday to Sunday).</p>
  <div id="gate" class="notice hidden"></div>
  <div id="app" class="hidden">
    <p class="meta" id="weekline"></p>
    <div id="msg" role="status" aria-live="polite"></div>
    <h2>My sessions</h2>
    <div id="mine"></div>
    <h2>Open sessions</h2>
    <div id="weekPickBox" class="row"></div>
    <div id="open"></div>
  </div>
</main>
<script src="challenge-common.js"></script>
<script>
(function () {
  const token = new URLSearchParams(location.search).get("c") || "";
  const gate = document.getElementById("gate"), app = document.getElementById("app");
  const msg = document.getElementById("msg");
  function showGate(text) { gate.textContent = text; gate.classList.remove("hidden"); app.classList.add("hidden"); }
  if (!token) { showGate("Open the training link Coach TreMayne sent you to book sessions."); return; }
  let state = { sessions: [], mine: [], eligible: false };
  let weekSel = "";   // selected week (Monday key); kept across refreshes, falls back to this week or the first week with sessions
  async function load() {
    const q = "c=" + encodeURIComponent(token);
    const [s, m] = await Promise.all([apiCall("GET", "/schedule/sessions", { query: q }), apiCall("GET", "/schedule/mine", { query: q })]);
    if (s.status === 401 || m.status === 401) { showGate("This link isn't valid. Ask Coach TreMayne for a new one."); return; }
    if (!s.ok || !m.ok) { showGate(msgFor(s.error || m.error)); return; }
    state = { sessions: s.data.sessions || [], mine: m.data.reservations || [], eligible: !!s.data.eligible };
    render();
  }
  function weekCount(key) { return state.mine.filter((r) => r.reservation_status === "booked" && r.session_status !== "closed" && weekKey(r.starts_at) === key).length; }
  function overlapsMine(s) { return state.mine.some((r) => r.reservation_status === "booked" && overlaps(r, s)); }
  function render() {
    if (!state.eligible) { showGate("Booking isn't open for your account yet. Contact Coach TreMayne."); return; }
    gate.classList.add("hidden"); app.classList.remove("hidden");
    const now = weekKey(new Date().toISOString());
    const thisWeek = weekCount(now);
    document.getElementById("weekline").textContent = "This week: " + thisWeek + " of 3 booked.";
    const mineBox = document.getElementById("mine");
    mineBox.innerHTML = "";
    if (!state.mine.length) mineBox.innerHTML = '<p class="meta">No sessions booked yet.</p>';
    for (const r of state.mine) {
      const c = document.createElement("div"); c.className = "card";
      if (r.reservation_status === "cancelled" || r.session_status === "closed") {
        const why = r.reservation_status === "cancelled"
          ? (r.cancel_reason === "timeoff" ? "Your booking was cancelled because Coach TreMayne is unavailable at this time. Please book another session." : "This booking was cancelled.")
          : "This session was closed by your coach.";
        const isCancelled = r.reservation_status === "cancelled";
        const info = document.createElement("div");
        const when = document.createElement("strong"); when.textContent = fmtTime(r.starts_at); info.appendChild(when);
        const dur = document.createElement("div"); dur.className = "meta"; dur.textContent = "45 minutes"; info.appendChild(dur);
        const note = document.createElement("div"); note.className = "meta"; note.textContent = why; info.appendChild(note);
        const pill = document.createElement("span"); pill.className = "pill bad"; pill.textContent = isCancelled ? "Cancelled" : "Session closed";
        c.appendChild(info); c.appendChild(pill);
        mineBox.appendChild(c);
        continue;
      }
      c.innerHTML = '<div><strong>' + fmtTime(r.starts_at) + '</strong><div class="meta">45 minutes</div></div>';
      const b = document.createElement("button"); b.className = "secondary"; b.textContent = "Cancel";
      b.setAttribute("aria-label", "Cancel " + fmtTime(r.starts_at));
      b.onclick = async () => {
        if (!confirm("Cancel this session?")) return;
        const res = await apiCall("POST", "/schedule/cancel", { query: "c=" + encodeURIComponent(token), body: { reservation_id: r.reservation_id } });
        if (res.ok) { setMsg(msg, "Session cancelled.", false); await load(); } else setMsg(msg, msgFor(res.error), true);
      };
      c.appendChild(b); mineBox.appendChild(c);
    }
    const openBox = document.getElementById("open");
    const pickBox = document.getElementById("weekPickBox");
    openBox.innerHTML = "";
    pickBox.innerHTML = "";
    const weeks = {};
    for (const s of state.sessions) (weeks[weekKey(s.starts_at)] = weeks[weekKey(s.starts_at)] || []).push(s);
    const keys = Object.keys(weeks).sort();
    if (!keys.length) openBox.innerHTML = '<p class="meta">No open sessions right now.</p>';
    else {
      weekSel = keys.includes(weekSel) ? weekSel : (keys.includes(now) ? now : keys[0]);
      const label = document.createElement("label"); label.textContent = "Week ";
      const sel = document.createElement("select"); sel.id = "weekPick"; sel.style.cssText = "font-size:16px;padding:8px";
      for (const k of keys) { const o = document.createElement("option"); o.value = k; o.textContent = fmtWeek(k); sel.appendChild(o); }
      sel.value = weekSel;
      sel.onchange = () => { weekSel = sel.value; render(); };
      label.appendChild(sel); pickBox.appendChild(label);
    }
    for (const k of keys.filter((x) => x === weekSel)) {
      const h = document.createElement("p"); h.className = "meta"; h.style.marginTop = "14px"; h.textContent = fmtWeek(k) + " (" + weekCount(k) + " of 3 booked)";
      openBox.appendChild(h);
      for (const s of weeks[k]) {
        const c = document.createElement("div"); c.className = "card";
        const full = s.remaining <= 0, wk = weekCount(k) >= 3, ovl = overlapsMine(s);
        const status = s.mine ? '<span class="pill ok">Booked</span>' : full ? '<span class="pill bad">Full</span>' : '<span class="pill">' + s.remaining + " of " + s.capacity + " left</span>";
        c.innerHTML = '<div><strong>' + fmtTime(s.starts_at) + '</strong><div class="meta">' + fmtHour(s.starts_at) + " to " + fmtHour(s.ends_at) + "</div></div>" + status;
        const b = document.createElement("button");
        b.textContent = s.mine ? "Booked" : "Book";
        b.disabled = s.mine || full || wk || ovl;
        if (wk && !s.mine) b.title = "Weekly limit reached";
        if (ovl && !s.mine) b.title = "Overlaps a booked session";
        b.setAttribute("aria-label", "Book " + fmtTime(s.starts_at));
        b.onclick = async () => {
          b.disabled = true;
          const res = await apiCall("POST", "/schedule/book", { query: "c=" + encodeURIComponent(token), body: { session_id: s.id } });
          if (res.ok) { setMsg(msg, "Booked. See you at " + fmtTime(s.starts_at) + ".", false); await load(); }
          else { setMsg(msg, msgFor(res.error), true); await load(); }
        };
        c.appendChild(b); openBox.appendChild(c);
      }
    }
  }
  load().catch(() => showGate(msgFor("network")));
})();
</script>
</body>
</html>
