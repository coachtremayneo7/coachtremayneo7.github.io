<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Your program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0e1613; --surface:#16211d; --line:#2a3b34;
--ink:#e9f0ec; --muted:#8fa89d;
--brand:#37c46b; --brand-deep:#2aa259; --on-brand:#04140a; --ring:#5fe08f;
--dot-glow:rgba(55,196,107,.15); --cta-glow:rgba(55,196,107,.6);
--shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;line-height:1.55;
-webkit-font-smoothing:antialiased;}
.wrap{max-width:640px;margin:0 auto;padding:22px 18px 120px;}
a{color:inherit;}
.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--dot-glow);}
.brand b{color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.01em;}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;
font-size:2.1rem;line-height:1.05;margin:20px 0 6px;}
/* white-space:pre-line lets line breaks typed in the plan intro show up (added for hotel/PF plans) */
.lede{color:var(--muted);margin:0 0 22px;max-width:60ch;white-space:pre-line;}
.weeks{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch;}
.weeks button{flex:0 0 auto;padding:9px 15px;border-radius:11px;border:1px solid var(--line);
background:var(--surface);color:var(--muted);font:600 .92rem Inter,sans-serif;cursor:pointer;}
.weeks button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);}
.weeks button:focus-visible{outline:2px solid var(--ring);outline-offset:2px;}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 6px;
margin:0 0 14px;box-shadow:var(--shadow);}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;}
.day-head h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem;margin:0;}
.day-head .focus{color:var(--brand);font-weight:600;font-size:.9rem;}
.ex{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--line);}
.ex:first-of-type{border-top:0;}
.ex .name{flex:1;font-weight:500;}
.ex .note{display:block;color:var(--muted);font-size:.86rem;font-weight:400;margin-top:2px;}
.ex .pres{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
.ex .watch{color:var(--brand);font-size:.85rem;font-weight:600;text-decoration:none;white-space:nowrap;}
.ex .watch:hover{text-decoration:underline;}
.rest{color:var(--muted);padding:11px 0;border-top:1px solid var(--line);font-style:italic;}
.cta{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 34%);
padding:26px 18px 20px;}
.cta .inner{max-width:640px;margin:0 auto;}
.cta a{display:block;text-align:center;background:var(--brand);color:var(--on-brand);font-weight:700;
padding:15px;border-radius:14px;text-decoration:none;box-shadow:0 8px 24px -10px var(--cta-glow);}
.cta a:focus-visible{outline:2px solid var(--ring);outline-offset:3px;}
.cta p{max-width:640px;margin:0 auto 9px;color:var(--muted);font-size:.85rem;text-align:center;}
.missing{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;color:var(--muted);}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><span class="dot"></span><b id="wordmark">The Reset</b><span id="track-label"></span></div>
<h1 id="title">Your program</h1>
<p class="lede" id="lede">Follow the week below. Check in every week — that's how we catch what's working and fix what isn't before it costs you a month.</p>
<div class="weeks" id="weeks" role="tablist" aria-label="Program weeks"></div>
<div id="days"></div>
</div>
<div class="cta">
<div class="inner">
<p>Done for the week?</p>
<a id="checkin-link" href="#">Submit this week's check-in</a>
</div>
</div>
<script>
/* ===== EDIT PROGRAMS BELOW. Each track: brand (dd|reset|travel), label, lede, weeks[].
exercise: name, pres, note?, rest?, hotel?, video? · rest day: { rest:"..." } ===== */
const BRANDS = {
reset: { wordmark:"The Reset", bg:"#0e1613", surface:"#16211d", line:"#2a3b34", muted:"#8fa89d",
brand:"#37c46b", deep:"#2aa259", onBrand:"#04140a", ring:"#5fe08f", dot:"rgba(55,196,107,.15)", cta:"rgba(55,196,107,.6)" },
dd: { wordmark:"Diesel & Discipline", bg:"#17130a", surface:"#211b10", line:"#3a3320", muted:"#a89a80",
brand:"#FFB020", deep:"#d98e00", onBrand:"#1a1200", ring:"#ffcf6b", dot:"rgba(255,176,32,.16)", cta:"rgba(255,176,32,.55)" },
travel: { wordmark:"Travel Plan", bg:"#171009", surface:"#211710", line:"#3a2c1d", muted:"#a8977f",
brand:"#ff7a2d", deep:"#e85f14", onBrand:"#1a0d02", ring:"#ffa970", dot:"rgba(255,122,45,.16)", cta:"rgba(255,122,45,.55)" },
};
const PROGRAMS = {
dd: {
brand: "dd",
label: "Diesel & Discipline",
lede: "Built to run from the road and the yard — keep your numbers right for the DOT physical. Log every session honestly in your weekly check-in.",
weeks: [
{ days: [
{ title:"Day 1", focus:"Full body", exercises:[
{ name:"Goblet squat", pres:"3 × 10", note:"Slow down, drive up." },
{ name:"Push-up (or bench)", pres:"3 × 10" },
{ name:"1-arm row", pres:"3 × 10 each" },
{ name:"Plank", pres:"3 × 30s" },
]},
{ rest:"Rest, or a 20–30 min walk at the truck stop." },
{ title:"Day 2", focus:"Conditioning", exercises:[
{ name:"Brisk walk / incline", pres:"20–30 min" },
]},
]},
]
},
fatloss: {
brand: "reset",
label: "Lose fat",
lede: "Four days on, built to keep muscle while the weight comes off. Log every session honestly in your weekly check-in.",
weeks: [
{ days: [
{ title:"Day 1", focus:"Full body", exercises:[
{ name:"Goblet squat", pres:"3 × 10", note:"Slow down, drive up." },
{ name:"Dumbbell bench press", pres:"3 × 10" },
{ name:"1-arm row", pres:"3 × 10 each" },
{ name:"Plank", pres:"3 × 30s" },
]},
{ rest:"Rest or a 20–30 min walk." },
{ title:"Day 2", focus:"Lower + core", exercises:[
{ name:"Romanian deadlift", pres:"3 × 10" },
{ name:"Walking lunge", pres:"3 × 12 each" },
{ name:"Hanging or lying leg raise", pres:"3 × 12" },
]},
{ title:"Day 3", focus:"Upper", exercises:[
{ name:"Incline press", pres:"3 × 10" },
{ name:"Lat pulldown", pres:"3 × 12" },
{ name:"Shoulder press", pres:"3 × 10" },
{ name:"Face pull", pres:"3 × 15" },
]},
{ title:"Day 4", focus:"Conditioning", exercises:[
{ name:"Intervals", pres:"20 min", note:"30s hard / 90s easy, any machine." },
]},
]},
]
},
muscle: {
brand: "reset",
label: "Build muscle",
lede: "An upper/lower split to add size. Push the weight up week over week — your check-in is where we track that it's actually moving.",
weeks: [
{ days: [
{ title:"Day 1", focus:"Upper", exercises:[
{ name:"Barbell bench press", pres:"4 × 6–8" },
{ name:"Bent-over row", pres:"4 × 8" },
{ name:"Overhead press", pres:"3 × 8" },
{ name:"Chin-up", pres:"3 × max" },
]},
{ title:"Day 2", focus:"Lower", exercises:[
{ name:"Back squat", pres:"4 × 6–8" },
{ name:"Romanian deadlift", pres:"3 × 8" },
{ name:"Leg press", pres:"3 × 12" },
{ name:"Calf raise", pres:"4 × 15" },
]},
{ rest:"Rest." },
{ title:"Day 3", focus:"Upper", exercises:[
{ name:"Incline dumbbell press", pres:"4 × 8–10" },
{ name:"Pull-up or pulldown", pres:"4 × 8–10" },
{ name:"Lateral raise", pres:"3 × 15" },
{ name:"Curl + triceps superset", pres:"3 × 12" },
]},
{ title:"Day 4", focus:"Lower", exercises:[
{ name:"Front squat", pres:"4 × 8" },
{ name:"Hip thrust", pres:"3 × 10" },
{ name:"Hamstring curl", pres:"3 × 12" },
]},
]},
]
},
travel: {
brand: "travel",
label: "Travel Plan",
lede: "No gym, no problem — bodyweight sessions you can run from a hotel room. Log every session honestly in your weekly check-in.",
weeks: [
{ days: [
{ title:"Day 1", focus:"Full body", exercises:[
{ name:"Bodyweight squat", pres:"3 × 15" },
{ name:"Incline push-up (desk/bed)", pres:"3 × 10" },
{ name:"Reverse lunge", pres:"3 × 10 each" },
{ name:"Plank", pres:"3 × 30s" },
]},
{ rest:"Rest or a 20–30 min walk." },
{ title:"Day 2", focus:"Conditioning", exercises:[
{ name:"Walk / stairs", pres:"20–30 min" },
]},
]},
]
},
};
/* ===== stop editing ===== */

const API_BASE = "https://checkin-api.quantumflexpt.workers.dev";

const params = new URLSearchParams(location.search);
const cid = params.get("c");

// FIX (9/24/2026): client hub links use the BRAND name as the track (e.g. track=reset),
// but PROGRAMS has no "reset" key, so the page showed "link looks off".
// TRACK_ALIAS maps brand names onto a program template. A client's custom plan
// (loaded by token below) still replaces the template when one exists.
const TRACK_ALIAS = { reset: "fatloss" };
const rawTrack = (params.get("track") || "fatloss").toLowerCase();
const trackKey = TRACK_ALIAS[rawTrack] || rawTrack;

// `prog` is the program the page is CURRENTLY rendering. It starts as the hardcoded
// brand template chosen by the URL, and is only reassigned if a valid custom plan loads.
let prog = PROGRAMS[trackKey];

// check-in button carries the client's token AND the brand skin straight through.
function setCheckinLink(brandKey) {
const qs = new URLSearchParams();
if (cid) qs.set("c", cid);
if (brandKey) qs.set("b", brandKey);
const q = qs.toString();
document.getElementById("checkin-link").href = "checkin.html" + (q ? "?" + q : "");
}
setCheckinLink(prog && prog.brand ? prog.brand : null);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function applyBrand(key) {
const b = BRANDS[key] || BRANDS.reset;
const r = document.documentElement.style;
r.setProperty("--bg", b.bg); r.setProperty("--surface", b.surface); r.setProperty("--line", b.line);
r.setProperty("--muted", b.muted); r.setProperty("--brand", b.brand); r.setProperty("--brand-deep", b.deep);
r.setProperty("--on-brand", b.onBrand); r.setProperty("--ring", b.ring);
r.setProperty("--dot-glow", b.dot); r.setProperty("--cta-glow", b.cta);
document.getElementById("wordmark").textContent = b.wordmark;
}

function renderProgram(p) {
prog = p;
const brandKey = (p.brand && BRANDS[p.brand]) ? p.brand : trackKey_brand();
applyBrand(brandKey);
const bb = BRANDS[brandKey] || BRANDS.reset;
setCheckinLink(brandKey);
document.getElementById("track-label").textContent = p.label ? ("· " + p.label) : "";
document.getElementById("title").textContent = p.label || "Your program";
document.getElementById("page-title").textContent = (p.label || "Your program") + " — " + bb.wordmark;
if (p.lede) document.getElementById("lede").textContent = p.lede;
buildWeeks(p.weeks || []);
}

function trackKey_brand() {
const t = PROGRAMS[trackKey];
return (t && t.brand) ? t.brand : "reset";
}

// ----- INITIAL RENDER -----
if (!prog) {
document.getElementById("days").innerHTML =
`<div class="missing">This program link looks off. Use the link Coach TreMayne sent you, or reach out and he'll resend it.</div>`;
document.querySelector(".cta").style.display = "none";
} else {
renderProgram(prog);
if (cid) tryCustomPlan(cid);
}

async function tryCustomPlan(token) {
try {
const ctrl = new AbortController();
const timer = setTimeout(() => ctrl.abort(), 6000);
const r = await fetch(API_BASE + "/workout-plan?c=" + encodeURIComponent(token), { signal: ctrl.signal });
clearTimeout(timer);
if (!r.ok) return;
const data = await r.json();
if (!data || data.has_plan !== true) return;
const plan = validatePlan(data.plan);
if (!plan) return;
renderProgram(plan);
} catch (_) {
/* keep the template already on screen */
}
}

function validatePlan(plan) {
if (!plan || typeof plan !== "object") return null;
if (!Array.isArray(plan.weeks) || plan.weeks.length === 0) return null;
for (const wk of plan.weeks) {
if (!wk || !Array.isArray(wk.days)) return null;
}
return plan;
}

function buildWeeks(weeks) {
const tabs = document.getElementById("weeks");
tabs.innerHTML = "";
weeks.forEach((_, i) => {
const btn = document.createElement("button");
btn.role = "tab"; btn.textContent = "Week " + (i + 1);
btn.setAttribute("aria-selected", i === 0);
btn.addEventListener("click", () => { showWeek(i); [...tabs.children].forEach((x, j) => x.setAttribute("aria-selected", j === i)); });
tabs.appendChild(btn);
});
showWeek(0);
}

function showWeek(i) {
const wrap = document.getElementById("days");
wrap.innerHTML = "";
const week = prog.weeks[i] || { days: [] };
for (const day of week.days) {
const el = document.createElement("div");
if (day.rest) { el.className = "day"; el.innerHTML = `<div class="rest">${esc(day.rest)}</div>`; wrap.appendChild(el); continue; }
el.className = "day";
let rows = "";
for (const ex of (day.exercises || [])) {
const watch = ex.video ? `<a class="watch" href="${esc(ex.video)}" target="_blank" rel="noopener">Watch</a>` : "";
const note = ex.note ? `<span class="note">${esc(ex.note)}</span>` : "";
const rest = ex.rest ? `<span class="note">Rest ${esc(ex.rest)}</span>` : "";
// Optional hotel substitution (added for hotel/Planet Fitness plans). Plans without it look exactly as before.
const hotel = ex.hotel ? `<span class="note">Hotel: ${esc(ex.hotel)}</span>` : "";
rows += `<div class="ex"><span class="name">${esc(ex.name)}${note}${rest}${hotel}</span>${ex.pres ? `<span class="pres">${esc(ex.pres)}</span>` : ""}${watch}</div>`;
}
el.innerHTML = `<div class="day-head"><h2>${esc(day.title)}</h2>${day.focus ? `<span class="focus">${esc(day.focus)}</span>` : ""}</div>${rows}`;
wrap.appendChild(el);
}
}
</script>
</body>
</html>
